plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def vs24ReferenceModsDir = file(findProperty('vs24_reference_mods_dir') ?: 'C:/Modding/Reference mod VS2.4')
def vs24ValkyrienSkiesJar = new File(vs24ReferenceModsDir, 'valkyrienskies-120-2.4.9/valkyrienskies-120-2.4.9.jar')

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mixin.config', 'vs_analog_warfare.mixins.json',
                    '--mixin.config', 'vs_analog_warfare.compat.mixins.json'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.java { srcDir 'src/stub/java' }

repositories {
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/mirror" }
    maven { url = "https://maven.tterrag.com/" }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    mavenCentral()
    mavenLocal()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files(vs24ValkyrienSkiesJar)
    // VS core api interfaces (ClientShip, LoadedShip, ...) jarjar'd inside the VS mod jar.
    compileOnly files('gradle/vs24-api/api-1.1.0+f6a942e0e1.jar')
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    compileOnly fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")
    compileOnly fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    compileOnly fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    compileOnly fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    runtimeOnly("io.github.llamalad7:mixinextras-forge:0.4.1")

    compileOnly "maven.modrinth:DistantHorizonsApi:5.1.0"

    // Provided at runtime by VS2's bundled joml; compile-only for AABBdc in CbcCompat.
    compileOnly 'org.joml:joml-primitives:1.10.0'

    // Optional local runtime reference for testing Ender Transmission mixins.
    // It is never bundled and does not become a mandatory mod dependency.
    def enderTransmissionJar = findProperty('ender_transmission_jar')
    if (enderTransmissionJar) runtimeOnly files(file(enderTransmissionJar))
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    exclude 'org/valkyrienskies/**'
    // Compile-only stubs; the real classes come from CBC at runtime.
    exclude 'rbasamoyai/**'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'vs_analog_warfare.mixins.json,vs_analog_warfare.compat.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
