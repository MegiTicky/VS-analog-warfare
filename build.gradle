plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// VS2.3 legacy runtime stack. These local jars are used only for development
// run configurations; they are not bundled into the VSAW jar.
def vs23ReferenceModsDir = file(findProperty('vs23_reference_mods_dir') ?: '../cbc_terminal_ballistics_parent/Reference mod VS2.3')
def vs23ReferenceAliasDir = file('gradle/vs23-reference-aliases')
def vs23OriginalValkyrienSkiesJar = new File(vs23ReferenceModsDir, 'valkyrienskies-120-2.3.0-beta.5tt16+f75b0eafe1 2.jar')
def vs23AliasedValkyrienSkiesJar = new File(vs23ReferenceAliasDir, 'valkyrienskies-120-2.3.0-beta.5tt16+f75b0eafe1-2.jar')
if (vs23OriginalValkyrienSkiesJar.exists() && !vs23AliasedValkyrienSkiesJar.exists()) {
    vs23ReferenceAliasDir.mkdirs()
    try {
        java.nio.file.Files.createLink(vs23AliasedValkyrienSkiesJar.toPath(), vs23OriginalValkyrienSkiesJar.toPath())
    } catch (Throwable ignored) {
        java.nio.file.Files.copy(vs23OriginalValkyrienSkiesJar.toPath(), vs23AliasedValkyrienSkiesJar.toPath())
    }
}
def vs23ReferenceMods = files({
    vs23ReferenceModsDir.exists()
            ? vs23ReferenceModsDir.listFiles({ File f -> f.name.endsWith('.jar') } as FileFilter)?.sort { it.name }
            : []
})
// VMod lives in a subdirectory of the reference dir; flatDir needs the exact
// directory added so 'vs23.local:VMod-Forge-1.20.1:0.1.3' resolves.
def vs23VmodDir = new File(vs23ReferenceModsDir, 'Vmod_0.1.3')
// VMod's mandatory KotlinForForge dep is not in the reference dir; alias it in
// from the JPCreate2.5 instance (same hardlink/copy pattern as the VS jar).
def vs23KffSourceJar = new File('C:/Users/lauya/curseforge/minecraft/Instances/JPCreate2.5/mods/kotlinforforge-4.11.0-all.jar')
def vs23KffAliasJar = new File(vs23ReferenceAliasDir, 'kotlinforforge-4.11.0-all.jar')
if (vs23KffSourceJar.exists() && !vs23KffAliasJar.exists()) {
    vs23ReferenceAliasDir.mkdirs()
    try {
        java.nio.file.Files.createLink(vs23KffAliasJar.toPath(), vs23KffSourceJar.toPath())
    } catch (Throwable ignored) {
        java.nio.file.Files.copy(vs23KffSourceJar.toPath(), vs23KffAliasJar.toPath())
    }
}
// CBC's jarjar'd Ritchie's Projectile Library stays SRG-named inside the
// reference jar (fg.deobf does not descend into nested jars) and crashes in
// the MCP-named dev runtime; alias the standalone instance jar instead.
def vs23RplSourceJar = new File('C:/Users/lauya/curseforge/minecraft/Instances/JPCreate2.5/mods/ritchiesprojectilelib-2.1.0+mc.1.20.1-forge.jar')
def vs23RplAliasJar = new File(vs23ReferenceAliasDir, 'ritchiesprojectilelib-2.1.0+mc.1.20.1-forge.jar')
if (vs23RplSourceJar.exists() && !vs23RplAliasJar.exists()) {
    vs23ReferenceAliasDir.mkdirs()
    try {
        java.nio.file.Files.createLink(vs23RplAliasJar.toPath(), vs23RplSourceJar.toPath())
    } catch (Throwable ignored) {
        java.nio.file.Files.copy(vs23RplSourceJar.toPath(), vs23RplAliasJar.toPath())
    }
}
// VMod's mandatory Architectury dep, aliased from the JPCreate2.5 instance too.
def vs23ArchSourceJar = new File('C:/Users/lauya/curseforge/minecraft/Instances/JPCreate2.5/mods/architectury-9.2.14-forge.jar')
def vs23ArchAliasJar = new File(vs23ReferenceAliasDir, 'architectury-9.2.14-forge.jar')
if (vs23ArchSourceJar.exists() && !vs23ArchAliasJar.exists()) {
    vs23ReferenceAliasDir.mkdirs()
    try {
        java.nio.file.Files.createLink(vs23ArchAliasJar.toPath(), vs23ArchSourceJar.toPath())
    } catch (Throwable ignored) {
        java.nio.file.Files.copy(vs23ArchSourceJar.toPath(), vs23ArchAliasJar.toPath())
    }
}
def vs23RuntimeModCoordinates = [
        'vs23.local:cbcmodernwarfare:0.0.6c+mc.1.20.1-forge',
        'vs23.local:cbcmoreshells:0.2.2',
        'vs23.local:copycats:2.2.2+mc.1.20.1-forge',
        'vs23.local:create-1.20.1:0.5.1.j',
        'vs23.local:createbigcannons:5.8.2tt3-dev+mc.1.20.1-forge',
        'vs23.local:createendertransmission:2.0.7-1.20.1',
        'vs23.local:rha:1.1.4-1.20.1',
        'vs23.local:s_a_b:1.4.3',
        // The uploaded VS jar has a " 2" suffix in its file name. Split that
        // suffix into the flatDir version so ForgeGradle can deobfuscate it.
        'vs23.local:valkyrienskies-120-2.3.0-beta.5tt16+f75b0eafe1:2',
        // Sim-harness runtime set: VMod (paste path) + its mandatory deps.
        // VMod runtime: OFF for now. VMod 0.1.3 reads its Forge config during
        // SchemNetworking's class-init at mod construct, which Forge forbids in
        // the dev environment ("Cannot get config value before config is
        // loaded" — dev-only strictness that production tolerates). Re-enable
        // when VMod ships a dev-safe build; VSAW's paste-compat mixins degrade
        // gracefully without it.
        // 'vs23.local:VMod-Forge-1.20.1:0.1.3',
        'vs23.local:kotlinforforge:4.11.0-all',
        'vs23.local:architectury:9.2.14-forge',
        // deobf'd standalone RPL so CBC's SRG nested copy never loads in dev
        'vs23.local:ritchiesprojectilelib:2.1.0+mc.1.20.1-forge'
]

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--mixin.config', 'vs_analog_warfare.mixins.json', '--mixin.config', 'vs_analog_warfare.compat.mixins.json'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
            // -Pvsaw.sim.autorun=true runs the sim-harness scenario registry
            // headless at server start, writes reports to run/sim_reports/,
            // then halts. -Pvsaw.sim.scenario=<name>[,<name>...] narrows it.
            property 'vsaw.sim.autorun', (project.findProperty('vsaw.sim.autorun') ?: 'false').toString()
            property 'vsaw.sim.scenario', (project.findProperty('vsaw.sim.scenario') ?: '').toString()
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
// Compile-only stubs live in their OWN source set: main compiles against the
// stub output, but stub classes are not part of main's runtime output, so dev
// runs and release jars never contain them. (With VS2/VMod on the dev runtime
// a stub in main's classes dir splits a package the real mod exports and the
// module layer refuses to boot.)
sourceSets {
    stub {
        java.srcDir 'src/stub/java'
    }
    main
}
// Stubs compile against the same external classpath as main (minecraft, CBC,
// kotlin, ...) but do not see main's own classes; main sees stub output for
// compilation only.
sourceSets.stub.compileClasspath = sourceSets.main.compileClasspath - sourceSets.stub.output
sourceSets.main.compileClasspath += sourceSets.stub.output

repositories {
    flatDir {
        dirs vs23ReferenceModsDir, vs23ReferenceAliasDir, vs23VmodDir
    }
    maven { url = "https://maven.tterrag.com/" }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    mavenCentral()
    mavenLocal()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf('vs23.local:create-1.20.1:0.5.1.j')
    compileOnly fg.deobf('vs23.local:createbigcannons:5.8.2tt3-dev+mc.1.20.1-forge')
    compileOnly fg.deobf('vs23.local:cbcmoreshells:0.2.2')
    // Compile-only classpath for the scope ping compat mixins (never packaged).
    compileOnly fg.deobf('vs23.local:pingwheel:1.12.0')
    compileOnly fg.deobf('vs23.local:steves_army:0.4.0')
    // Compile-only for the ship-aware schematic mixins; excluded from the jar below.
    // Ship/api classes live in the vs-core api jar bundled (jarjar) inside the VS mod jar.
    compileOnly fg.deobf('vs23.local:valkyrienskies-120-2.3.0-beta.5tt16+f75b0eafe1:2')
    compileOnly files('gradle/vs23-api/api-1.1.0+b19b27c4a4.jar')
    compileOnly 'com.tterrag.registrate:Registrate:MC1.20-1.3.3'
    compileOnly "maven.modrinth:DistantHorizonsApi:5.1.0"
    runtimeOnly "maven.modrinth:DistantHorizonsApi:5.1.0"
    compileOnly 'org.joml:joml-primitives:1.10.0'
    // Flywheel is bundled inside Create's jarjar (0.6.11) at runtime; this is the
    // exact matching version, used only for compilation (never packaged).
    compileOnly files('gradle/flywheel/flywheel-forge-1.20.1-0.6.11-13.jar')
    
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    runtimeOnly("io.github.llamalad7:mixinextras-forge:0.4.1")

    vs23RuntimeModCoordinates.each { runtimeOnly fg.deobf(it) }
    // Kotlin stdlib: compile-only. At runtime KFF (above) bundles and exports
    // its own — a second kotlin-stdlib on the module path crashes boot with a
    // split-package ResolutionException.
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}

tasks.register('printVs23ReferenceMods') {
    group = 'help'
    description = 'Prints the local VS2.3 reference jars used by runClient/runServer.'
    doLast {
        println "VS2.3 reference mod directory: ${vs23ReferenceModsDir}"
        if (!vs23ReferenceModsDir.exists()) {
            println '  (directory missing; set -Pvs23_reference_mods_dir=<path> to override)'
            return
        }
        vs23ReferenceMods.files.each { println "  - ${it.name}" }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    exclude 'org/valkyrienskies/**'
    exclude 'net/spaceeye/valkyrien_ship_schematics/**'
    exclude 'rbasamoyai/**'
    // headless sim harness: dev-only, sources stay untracked, never ships
    exclude 'com/erika/vsanalogwarfare/simharness/**'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'vs_analog_warfare.mixins.json,vs_analog_warfare.compat.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

